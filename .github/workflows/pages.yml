name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # каталог замков, страницы замков и sitemap собираются из locks.yaml
      - name: Build lock catalog
        run: |
          npm ci
          npm run build:locks

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Collect static files
        run: |
          mkdir -p dist/en
          cp index.html og.png robots.txt sitemap.xml 404.html dist/
          cp favicon.ico favicon.svg apple-touch-icon.png icon-192.png icon-512.png site.webmanifest dist/
          cp en/index.html dist/en/
          cp -r locks dist/
          cp -r en/locks dist/en/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # домен сайта - из файла CNAME (единственное место, где он задан)
      - name: Set custom domain
        run: |
          DOMAIN=$(tr -d ' \r\n' < CNAME)
          curl -sf -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d "{\"cname\":\"$DOMAIN\"}" \
            || echo "::warning::Не удалось прописать домен $DOMAIN для GitHub Pages"
