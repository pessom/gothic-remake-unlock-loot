name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # каталог замков, страницы замков и sitemap собираются из locks.yaml
      - name: Build lock catalog
        run: |
          npm ci
          npm run build:locks

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # site/ - корень сайта целиком (исходники + только что собранный каталог)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # домен (gothic-remake-unlock-loot.pessom.xyz, см. site/CNAME) задан в
      # Settings -> Pages и сохраняется между деплоями; токен CI менять его не может
      - id: deployment
        uses: actions/deploy-pages@v4
