# Каталог замков UnlockMyLoot - единственный источник списка замков.
# Отсюда собираются (npm run build:locks, в CI - при каждом деплое):
#   - подсказка связей в решателе (по совпадению стартовых штифтов);
#   - карточки каталога /locks/ и /en/locks/;
#   - страницы замков /locks/<slug>/ и /en/locks/<slug>/, sitemap.xml.
# Число плиток, штифты, ходы и связи считаются автоматически по коду замка.
#
# Поля замка:
#   code      код из ссылки ?lock=... (обязательно)
#   slug      адрес страницы замка; без slug - только карточка в каталоге
#   aliases   старые адреса страницы - с них будет редирект на slug
#   suggest   false - не подсказывать связи в решателе по штифтам
#   credit    кто прислал конфигурацию: url (необязательно), ru/en: label (подпись на странице), by (имя)
#   ru / en   тексты на двух языках:
#     name      название на карточке и в подсказке решателя (обязательно)
#     pageName  название в «хлебных крошках» страницы, если отличается от name
#     card      описание на карточке каталога (обязательно)
#     title, desc, lead, where, inside, faq (список {q, a}) - страница замка (обязательны при slug)
# В текстах можно HTML (ссылки <a href>). Двойные кавычки в title/desc/card - нельзя, используй «ёлочки».
# Порядок замков = порядок карточек в каталоге.

- code: aUkAACUBAAJikA
  slug: ruined-tower-door
  ru:
    name: Дверь Разрушенной башни
    card: Дверь у основания Разрушенной башни рядом со Старым лагерем
    title: Как открыть дверь Разрушенной башни в Gothic 1 Remake
    desc: "Дверь стоит у основания Разрушенной башни недалеко от Старого лагеря. За дверью - склеп с трупом и сундуком: добротное снаряжение для раннего этапа. Параметры: 6 плиток, 57 ходов, 10 связей. Открой без сломанных отмычек."
    lead: "Дверь у основания Разрушенной башни  -  один из длиннейших замков раннего прохождения: 57 ходов и 6 плиток. В старых гайдах встречался ошибочный код без стартовых штифтов; здесь полная проверенная конфигурация, сверенная с игрой."
    where: "Выходишь к башне по тропе мимо Старого лагеря. За дверью  -  склеп с трупом и сундуком: добротное снаряжение, которое многие ищут по запросу «дверь разрушенной башни Gothic Remake»."
    inside: Склеп с трупом и сундуком  -  снаряжение для раннего этапа. У этого замка плитка 5 имеет четыре исходящие связи; именно на нём в решателе ловили баг BFS-помощника.
    faq:
      - q: Почему в старых гайдах другой код?
        a: Популярный код <code>YHayiAREIAIABE</code> (45 ходов, другие штифты) оказался неверным для этой двери. Актуальная конфигурация  -  <code>aUkAACUBAAJikA</code>, 57 ходов.
      - q: Сколько ходов нужно?
        a: Кратчайший безопасный путь  -  57 ходов (6 плиток, 10 связей). Решатель показывает их по шагам.
      - q: Что если позиции штифтов не совпадают?
        a: Значит у тебя другой экземпляр замка. Введи свои штифты в решателе  -  он найдёт путь для твоей расстановки.
  en:
    name: Ruined Tower door
    card: Door at the base of the Ruined Tower near the Old Camp
    title: How to open the Ruined Tower door in Gothic 1 Remake
    desc: "The door is at the base of the Ruined Tower near the Old Camp. Behind it lies a crypt with a body and a chest holding solid early-game gear. Stats: 6 plates, 57 moves, 10 links. Open it without breaking lockpicks."
    lead: "The door at the base of the Ruined Tower is one of the longest early-game locks: 57 moves across 6 plates. Old guides often listed the wrong code without pin positions; this page has the full verified configuration from in-game checks."
    where: Follow the trail past the Old Camp to the tower base. Behind the door is a crypt with a corpse and chest  -  solid early gear that players search for as "Ruined Tower door Gothic Remake".
    inside: A crypt with a corpse and chest  -  early-game equipment. Plate 5 has four outgoing links; this is the lock where the solver's BFS helper bug was first caught.
    faq:
      - q: Why do old guides show a different code?
        a: The popular code <code>YHayiAREIAIABE</code> (45 moves, different pins) turned out wrong for this door. The correct config is <code>aUkAACUBAAJikA</code>, 57 moves.
      - q: How many moves?
        a: The shortest safe path is 57 moves (6 plates, 10 links). The solver shows them step by step.
      - q: What if my pin positions differ?
        a: You have a different lock instance. Enter your pins in the solver  -  it will find a path for your layout.
